[project]
name = "minx"
description = "minx"
dynamic = ["version"]
build-targets = ["wheel"]
authors = [{ name = "Paul Everitt", email = "pauleveritt@me.com" }]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/pauleveritt/minx"
repository = "https://github.com/pauleveritt/minx"
documentation = "https://minx.readthedocs.io"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "tagged~=0.0.2",
    "venusian~=3.1",
    "htm~=0.1.1",
    "MarkupSafe~=2.1",
    "hopscotch>=0.3",
    "anyio~=4.4",
    "starlette~=0.38",
    "watchfiles~=0.23",
    "uvicorn~=0.30"
]

[tool.hatch.urls]
Changelog = "https://github.com/pauleveritt/minx/releases"


[tool.hatch.version]
path = "src/minx/version.py"

[tool.hatch.envs.default]
dependencies = [
    "pytest~=8.3",
    "sybil~=6.1",
    "coverage[toml]~=7.6",
    "pytest-cov~=5.0",
    "black~=24.4",
    "sphinx~=7.4",
    "beautifulsoup4~=4.12",
    "pre-commit~=3.5.0",
    "pre-commit-hooks~=4.1.0",
    "sphinx-autobuild~=2024.4",
    "Pygments~=2.18",
    "furo~=2024.7",
    "myst-parser~=4.0",
]

[tool.hatch.envs.mypy]
dependencies = [
    "mypy~=1.11",
]
[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["minx"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
addopts = "-p no:doctest"
testpaths = ["tests", "examples", "docs"]

[tool.mypy]
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = [
    "tests"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.hatch.envs.default.matrix]]
python = ["3.11", "3.12"]

[[tool.hatch.envs.pre-commit.matrix]]
python = ["3.12"]

[[tool.hatch.envs.mypy.matrix]]
python = ["3.12"]

[[tool.hatch.envs.docs-build.matrix]]
python = ["3.12"]

[tool.hatch.envs.default.scripts]
run = "pytest --cov-config=pyproject.toml --cov=pkg --cov=tests"
lint = "ruff check src/minx tests docs/conf.py && ruff format --check src/minx tests docs/conf.py"
format = "ruff check --fix src/minx tests docs/conf.py && ruff format src/minx tests docs/conf.py"

[tool.hatch.envs.pre-commit.scripts]
run = "pre-commit run --all-files --show-diff-on-failure"
install = "pre-commit install"

[tool.hatch.envs.mypy.scripts]
run = "mypy src/minx"

[tool.hatch.envs.docs-build.scripts]
run = "sphinx-build docs docs/_build"

[tool.ruff]
line-length = 88
extend-select = ['B','B9','C','D','E','F','N','S','W']
flake8-quotes = {inline-quotes = 'double', multiline-quotes = 'double'}
target-version = 'py311'
ignore = ['E203','E501','N802','B009','B010']

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.extend-per-file-ignores]
"tests/*" = ["S101"]
"examples/*" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
